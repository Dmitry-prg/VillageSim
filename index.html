<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Деревня 3D — симулятор</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #timers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .v-timer{
    position:absolute;transform:translate(-50%,-100%);
    color:#fff;font-weight:700;font-size:13px;
    text-shadow:0 0 4px #000,0 0 8px #000,0 1px 2px #000;
    white-space:nowrap;padding:2px 8px;
    background:rgba(0,0,0,.5);border-radius:8px;
    border:1px solid rgba(255,255,255,.22)
  }
  #topbar{
    position:fixed;top:10px;left:10px;right:10px;
    background:rgba(14,20,27,.88);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;color:#e8f1f8;
    box-shadow:0 10px 32px rgba(0,0,0,.45);
    pointer-events:auto;padding:10px 14px;
    display:grid;grid-template-columns:1fr auto auto auto;
    grid-template-areas:"resources objects economy actions";
    gap:14px;align-items:center;z-index:20
  }
  .tb-section{display:flex;gap:8px;align-items:center}
  .tb-resources{grid-area:resources;flex-wrap:wrap;gap:6px}
  .tb-objects{grid-area:objects;flex-wrap:wrap;gap:6px}
  .tb-economy{grid-area:economy;display:flex;flex-direction:column;gap:3px;
    padding-left:14px;border-left:1px solid rgba(255,255,255,.09);font-size:12px;min-width:110px}
  .tb-actions{grid-area:actions;display:flex;gap:6px;align-items:center;
    padding-left:14px;border-left:1px solid rgba(255,255,255,.09)}
  .tb-compact{display:none;gap:6px;align-items:center;flex-wrap:wrap}
  .res{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;
    padding:4px 9px;border-radius:9px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.06);white-space:nowrap}
  .res .ico{font-size:14px;line-height:1}
  .res b{font-weight:700}
  .stat{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#b9cad9}
  .stat .lbl{font-size:12px;opacity:.9}
  .stat b{color:#fff;font-weight:700;font-size:12px}
  .pos{color:#5ee08a !important}
  .neg{color:#ff7a7a !important}
  .listbtn{padding:7px 12px;border-radius:9px;cursor:pointer;font-family:inherit;
    font-size:12.5px;font-weight:700;color:#e8f1f8;background:rgba(255,255,255,.06);
    border:1.5px solid rgba(255,255,255,.11);
    transition:transform .12s,border-color .12s,background .12s;
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .listbtn:hover{transform:translateY(-2px);border-color:rgba(120,225,165,.7);background:rgba(74,222,128,.08)}
  .listbtn .cnt{background:rgba(255,255,255,.14);padding:1px 6px;border-radius:5px;font-size:10.5px;font-weight:700}
  .icon-btn{width:38px;height:38px;padding:0;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.11);
    color:#e8f1f8;font-size:18px;
    transition:transform .12s,border-color .12s,background .12s;font-family:inherit}
  .icon-btn:hover{transform:translateY(-2px);border-color:rgba(120,225,165,.7);background:rgba(74,222,128,.08)}
  .icon-btn.danger:hover{border-color:rgba(255,120,120,.75);background:rgba(255,80,80,.12)}
  .compact-btn{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;
    cursor:pointer;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.11);
    color:#e8f1f8;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;
    transition:transform .12s,border-color .12s,background .12s}
  .compact-btn:hover{transform:translateY(-2px);border-color:rgba(120,225,165,.7);background:rgba(74,222,128,.08)}
  .compact-btn .cm-ico{font-size:14px}
  .compact-btn .cm-val{color:#fff;font-weight:700}
  .compact-btn .cm-sep{opacity:.35}
  #topbtns{position:fixed;bottom:14px;right:14px;display:flex;gap:8px;pointer-events:auto;z-index:25}
  .tbtn{padding:11px 20px;border-radius:12px;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:700;color:#e8f1f8;background:rgba(14,22,30,.92);
    border:1.5px solid rgba(255,255,255,.14);
    transition:transform .13s,border-color .13s,background .13s,box-shadow .13s;
    display:flex;align-items:center;gap:7px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .tbtn:hover{transform:translateY(-2px);border-color:rgba(120,225,165,.75)}
  .tbtn.primary{background:linear-gradient(135deg,#2f9e5c,#3fb56c);border-color:rgba(120,255,180,.55);color:#fff}
  .tbtn.primary:hover{box-shadow:0 0 22px rgba(74,222,128,.5)}
  .tbtn.active{border-color:#4ade80;box-shadow:0 0 20px rgba(74,222,128,.4)}
  #plus-menu{position:fixed;bottom:70px;right:14px;width:min(660px,94vw);max-height:70vh;
    overflow-y:auto;background:rgba(14,20,27,.97);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.14);border-radius:16px;
    box-shadow:0 18px 48px rgba(0,0,0,.6);padding:14px;pointer-events:auto;z-index:30;
    opacity:0;visibility:hidden;transform:translateY(8px);
    transition:opacity .18s,visibility .18s,transform .18s}
  #plus-menu.open{opacity:1;visibility:visible;transform:translateY(0)}
  #plus-menu::-webkit-scrollbar{width:6px}
  #plus-menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  .pm-section{margin-bottom:14px}.pm-section:last-child{margin-bottom:0}
  .pm-head{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#9fd8b4;margin-bottom:8px;padding-left:4px}
  .pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:7px}
  .pm-item{display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;
    padding:10px 11px;border-radius:11px;font-family:inherit;color:#dfeaf2;
    background:rgba(255,255,255,.045);border:1.5px solid rgba(255,255,255,.08);
    transition:transform .12s,border-color .12s,background .12s}
  .pm-item:hover{transform:translateY(-2px);border-color:rgba(120,225,165,.7);background:rgba(74,222,128,.09)}
  .pm-item .pm-name{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
  .pm-item .pm-cost{font-size:11px;color:#93a8bb}
  .pm-item .pm-info{font-size:10.5px;color:#6f8498;line-height:1.3}
  #context-menu{position:fixed;min-width:230px;padding:6px;background:rgba(14,20,27,.98);
    backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:12px;
    box-shadow:0 14px 40px rgba(0,0,0,.65);pointer-events:auto;z-index:100;display:none}
  #context-menu.open{display:block}
  .ctx-title{font-size:11.5px;color:#9fd8b4;font-weight:800;letter-spacing:.4px;
    text-transform:uppercase;padding:8px 12px 6px;border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ctx-title .lvl{color:#ffd66b;font-size:11px}
  .ctx-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;
    border-radius:8px;background:transparent;border:none;cursor:pointer;
    color:#dfeaf2;font-family:inherit;font-size:13px;font-weight:600;
    text-align:left;transition:background .12s}
  .ctx-btn:hover:not(:disabled){background:rgba(255,255,255,.09)}
  .ctx-btn.danger{color:#ff9a9a}
  .ctx-btn.danger:hover:not(:disabled){background:rgba(255,80,80,.16)}
  .ctx-btn:disabled{opacity:.4;cursor:not-allowed}
  .ctx-btn .sub{color:#7d92a5;font-weight:400;font-size:11px;margin-left:auto}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{width:min(440px,92vw);background:rgba(20,28,37,.98);
    border:1px solid rgba(255,255,255,.15);border-radius:18px;
    box-shadow:0 24px 64px rgba(0,0,0,.75);padding:22px 24px;
    color:#e8f1f8;animation:popIn .2s ease;max-height:80vh;display:flex;flex-direction:column}
  @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .modal h3{font-size:17px;margin-bottom:12px;color:#fff;font-weight:700}
  .modal-body{font-size:14px;line-height:1.6;color:#b9cad9;margin-bottom:20px;overflow-y:auto}
  .modal-body .cost{color:#ffd66b;font-weight:700}
  .modal-body .desc{color:#8fa5b8;font-size:13px;display:block;margin-top:6px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:auto}
  .mbtn{padding:10px 20px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:transform .12s,filter .12s;position:relative;z-index:5}
  .mbtn:hover{transform:translateY(-1px)}
  .mbtn.cancel{background:rgba(255,255,255,.07);color:#c0cfdd;border-color:rgba(255,255,255,.13)}
  .mbtn.confirm{background:linear-gradient(135deg,#2f9e5c,#3fb56c);color:#fff;border-color:rgba(120,255,180,.5)}
  .mbtn.danger{background:linear-gradient(135deg,#c43b3b,#e05050);color:#fff;border-color:rgba(255,140,140,.5)}
  .name-input{width:100%;padding:12px 14px;border-radius:10px;font-family:inherit;font-size:15px;background:rgba(255,255,255,.06);color:#fff;border:1.5px solid rgba(255,255,255,.14);outline:none;transition:border-color .15s}
  .name-input:focus{border-color:#4ade80}
  .name-error{color:#ff9090;font-size:12.5px;margin-top:6px;min-height:16px}
  .picker-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;margin-bottom:16px}
  .picker-list::-webkit-scrollbar{width:6px}
  .picker-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  .picker-item{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:rgba(255,255,255,.05);
    border:1.5px solid rgba(255,255,255,.1);border-radius:10px;color:#dfeaf2;
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    transition:background .12s,border-color .12s;text-align:left}
  .picker-item:hover:not(:disabled){background:rgba(74,222,128,.1);border-color:rgba(120,225,165,.6)}
  .picker-item:disabled{opacity:.4;cursor:not-allowed}
  .picker-item .sub{color:#7d92a5;font-size:12px;font-weight:400}
  .picker-item .hunger-bar{width:56px;height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  .picker-item .hunger-bar span{display:block;height:100%;background:#5ee08a;border-radius:3px}
  #toasts{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;z-index:150;max-width:90vw}
  .toast{padding:9px 18px;border-radius:11px;font-size:13.5px;font-weight:600;background:rgba(14,22,30,.95);border:1px solid rgba(255,255,255,.13);color:#e8f1f8;animation:pop .25s ease;white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.4)}
  .toast.err{border-color:rgba(255,110,110,.6);color:#ffb0b0}
  .toast.ok{border-color:rgba(90,225,140,.55);color:#a8f0c4}
  .toast.warn{border-color:rgba(255,200,80,.7);color:#ffe090}
  .toast.out{opacity:0;transform:translateY(-10px);transition:.35s}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
  .help-content{font-size:14px;line-height:2.1;color:#b9cad9}
  .help-content b{color:#e8f1f8}
  .help-content kbd{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:1px 8px;font-family:inherit;font-size:12px;color:#e2eef8}
  .help-content .row{display:flex;gap:12px;align-items:baseline;padding:3px 0}
  .help-content .row span:first-child{min-width:180px;color:#8fa5b8}
  .cm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .cm-cell{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:13.5px}
  .cm-cell .cm-ico{font-size:18px}
  .cm-cell .cm-lbl{color:#93a8bb;font-size:12px;display:block}
  .cm-cell b{color:#fff;font-size:15px;font-weight:700;display:block;margin-top:2px}
  @media (max-width: 1100px){
    #topbar{grid-template-columns:1fr auto;grid-template-areas:"resources actions" "objects actions" "economy actions";gap:8px 14px}
    .tb-actions{padding-left:12px;align-self:center}
    .res{font-size:12px;padding:3px 8px}
    .listbtn{font-size:12px;padding:6px 10px}
  }
  @media (max-width: 820px), (orientation: landscape) and (max-height: 500px){
    #topbar{top:6px;left:6px;right:6px;padding:8px 10px;border-radius:12px;grid-template-columns:1fr auto;grid-template-areas:"compact actions";gap:8px}
    .tb-resources,.tb-objects,.tb-economy{display:none}
    .tb-compact{display:flex}
    .tb-actions{padding-left:0;border-left:none;gap:5px}
    .icon-btn{width:36px;height:36px;font-size:17px;border-radius:9px}
    .compact-btn{padding:6px 9px;font-size:12px;gap:4px}
    .compact-btn .cm-ico{font-size:13px}
    #topbtns{bottom:10px;right:10px;gap:6px}
    .tbtn{padding:9px 14px;font-size:12.5px}
    #plus-menu{bottom:60px;right:10px;width:min(560px,96vw);padding:11px}
    .pm-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
    .pm-item{padding:8px 9px}
    .pm-item .pm-name{font-size:12px}
    .pm-item .pm-info{font-size:10px}
  }
  @media (orientation: landscape) and (max-height: 420px){
    #topbar{top:4px;left:4px;right:4px;padding:6px 8px}
    .compact-btn{padding:5px 8px;font-size:11px}
    .icon-btn{width:32px;height:32px;font-size:15px}
    #topbtns .tbtn{padding:7px 11px;font-size:11.5px}
    #plus-menu{bottom:48px;padding:8px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="timers"></div>
  <div id="topbar">
    <div class="tb-compact">
      <button class="compact-btn" id="compact-res-btn" title="Ресурсы">
        <span class="cm-ico">💰</span><span class="cm-val" id="c-money">0</span>
        <span class="cm-sep">·</span>
        <span class="cm-ico">🌾</span><span class="cm-val" id="c-food">0</span>
        <span class="cm-sep">·</span>
        <span class="cm-ico">🪵</span><span class="cm-val" id="c-wood">0</span>
      </button>
      <button class="compact-btn" id="compact-obj-btn" title="Объекты">
        <span class="cm-ico">👥</span><span class="cm-val" id="c-villagers">0</span>
        <span class="cm-sep">·</span>
        <span class="cm-ico">🏠</span><span class="cm-val" id="c-buildings">0</span>
        <span class="cm-sep">·</span>
        <span class="cm-ico">🚧</span><span class="cm-val" id="c-env">0</span>
      </button>
      <button class="compact-btn" id="compact-econ-btn" title="Экономика">
        <span class="cm-ico">📊</span>
      </button>
    </div>
    <div class="tb-section tb-resources">
      <div class="res"><span class="ico">💰</span><b id="r-money">0</b></div>
      <div class="res"><span class="ico">🌾</span><b id="r-food">0/0</b></div>
      <div class="res"><span class="ico">🪵</span><b id="r-wood">0/0</b></div>
      <div class="res"><span class="ico">👥</span><b id="r-pop">0/0</b></div>
      <div class="res"><span class="ico">🐔</span><b id="r-chickens">0</b></div>
      <div class="res"><span class="ico">👷</span><b id="r-jobs">0/0</b></div>
    </div>
    <div class="tb-section tb-objects">
      <button class="listbtn" id="list-villagers">👥 Жители <span class="cnt" id="cnt-villagers">0</span></button>
      <button class="listbtn" id="list-buildings">🏠 Постройки <span class="cnt" id="cnt-buildings">0</span></button>
      <button class="listbtn" id="list-environment">🚧 Окружение <span class="cnt" id="cnt-environment">0</span></button>
    </div>
    <div class="tb-section tb-economy">
      <div class="stat"><span class="lbl">🌾 Еда</span><b id="s-food">+0.0/с</b></div>
      <div class="stat"><span class="lbl">🪵 Дерево</span><b id="s-wood">+0.0/с</b></div>
      <div class="stat"><span class="lbl">💰 Доход</span><b id="s-income">+0.0/с</b></div>
    </div>
    <div class="tb-actions">
      <button class="icon-btn" id="help-btn" title="Инструкция">📖</button>
      <button class="icon-btn" id="save-btn" title="Сохранить прогресс">💾</button>
      <button class="icon-btn danger" id="clear-btn" title="Очистить прогресс">🗑️</button>
    </div>
  </div>
  <div id="topbtns">
    <button class="tbtn primary" id="plus-btn">➕ Добавить</button>
  </div>
  <div id="plus-menu"></div>
  <div id="context-menu"></div>
  <div id="toasts"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   1. ОПРЕДЕЛЕНИЯ
   ========================================================= */
const BUILDINGS = {
  house:     { name: 'Жилой дом',  icon: '🏠', cost: { money: 200, wood: 12 }, info: 'Ур.1: 2 жителя → Ур.3: 8', capacities: [2, 4, 8], jobs: 0, radius: 2.8 },
  coop:      { name: 'Курятник',   icon: '🐔', cost: { money: 100, wood: 5 },  info: '+0.5 еды/с · 1 раб.',     jobs: 1, food: 0.5, radius: 2.3 },
  farm:      { name: 'Ферма',      icon: '🌾', cost: { money: 280, wood: 20 }, info: '+1.4 еды/с · 2 раб.',     jobs: 2, food: 1.4, radius: 4.4 },
  sawmill:   { name: 'Лесопилка',  icon: '🪚', cost: { money: 220, wood: 8 },  info: '+0.35 дер./с · 2 раб.',   jobs: 2, wood: 0.35, radius: 2.9 },
  market:    { name: 'Рынок',      icon: '🏪', cost: { money: 150, wood: 10 }, info: '+2.5💰/с и продажа · 1 раб.', jobs: 1, radius: 2.5 },
  warehouse: { name: 'Склад',      icon: '📦', cost: { money: 180, wood: 15 }, info: '+150 к лимиту',          jobs: 0, radius: 3.1 },
  pier:      { name: 'Пирс',       icon: '🎣', cost: { money: 80, wood: 6 },   info: 'Место для рыбалки',       jobs: 0, radius: 2.0, needsRiver: true, onWater: true },
  fence:     { name: 'Забор',      icon: '🚧', cost: { money: 8, wood: 2 },    info: 'Держит хищников',         jobs: 0, radius: 1.2, isFence: true },
  gate:      { name: 'Ворота',     icon: '🚪', cost: { money: 25, wood: 5 },   info: 'Открываются при жителе',  jobs: 0, radius: 1.4, isFence: true, isGate: true }
};

const BUILDING_CATEGORIES = [
  { title: '🏠 Здания', types: ['house', 'coop', 'farm', 'sawmill', 'market', 'warehouse', 'pier'] },
  { title: '🚧 Окружение', types: ['fence', 'gate'] }
];

const VILLAGERS = {
  man:   { name: 'Мужчина', icon: '👨', cost: { money: 60 }, info: 'Работящий житель' },
  woman: { name: 'Женщина', icon: '👩', cost: { money: 60 }, info: 'Жительница деревни' }
};

const SHOP_ITEMS = {
  food:    { cat: 'resources', name: 'Еда',    icon: '🍞', cost: { money: 70 },  info: 'Купить 80 еды',
             apply: () => { state.food = Math.min(state.capFood, state.food + 80); } },
  wood:    { cat: 'resources', name: 'Дерево', icon: '🪵', cost: { money: 100 }, info: 'Купить 40 дерева',

(function buildRiverMesh() {
  const halfW = RIVER_HALF_WIDTH;
  const xMin = -BOUND - 6, xMax = BOUND + 6;
  const segments = 60;
  const vertices = [], uvs = [], indices = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = xMin + t * (xMax - xMin);
    vertices.push(x, 0.05, RIVER_Z - halfW);
    vertices.push(x, 0.05, RIVER_Z + halfW);
    uvs.push(t * 20, 0); uvs.push(t * 20, 1);
  }
  for (let i = 0; i < segments; i++) {
    const a = i*2, b = i*2+1, c = i*2+2, d = i*2+3;
    indices.push(a, c, b); indices.push(b, c, d);
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geom.setIndex(indices); geom.computeVertexNormals();
  riverMesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
    color: 0x4a90c8, roughness: 0.15, metalness: 0.25,
    transparent: true, opacity: 0.9, side: THREE.DoubleSide

function equipTool(v, toolType) {
  if (v._toolMesh) {
    v.group.remove(v._toolMesh);
    v._toolMesh.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
    v._toolMesh = null;
  }
  if (!toolType) return;
  let tool;
  if (toolType === 'axe') {
    tool = makeAxeMesh();
    tool.position.set(0.30, 0.72, 0.05);
    tool.userData.toolKind = 'axe';
  } else if (toolType === 'rod') {
    tool = makeRodMesh();
    tool.position.set(0.30, 1.05, 0.10);
    tool.userData.toolKind = 'rod';
  } else if (toolType === 'rifle') {
    tool = makeRifleMesh();
    tool.position.set(0.30, 0.95, 0.10);
    tool.rotation.set(-0.15, 0, 0);
    tool.userData.toolKind = 'rifle';
  }
  if (!tool) return;
  v.group.add(tool);
  v._toolMesh = tool;
}

function isValidPlacement(type, x, z, ignoreBuilding = null) {
  if (Math.abs(x) > BOUND - 1 || Math.abs(z) > BOUND - 1) return false;
  const def = BUILDINGS[type];
  const r = def.radius;
  const rd = riverDistance(x, z);
  const inRiver = isInRiver(x, z);
  if (def.onWater) {
    if (Math.abs(z - RIVER_Z) > RIVER_HALF_WIDTH + 3) return false;
  } else if (def.needsRiver) {
    if (inRiver) return false;
    if (rd > 2.5) return false;
  } else if (def.isFence) {
    if (rd < 0.2) return false;
  } else {
    if (rd < 1.0) return false;
  }
  for (const b of state.buildings) {
    if (b === ignoreBuilding) continue;
    let buffer = 0.35;
    if (def.isFence && b.def.isFence) buffer = -0.55;
    if (def.onWater && b.def.onWater) buffer = -0.9;
    const minD = r + b.def.radius + buffer;
    if ((b.x - x) ** 2 + (b.z - z) ** 2 < minD * minD) return false;
  }
  for (const v of state.villagers) {
    if (Math.hypot(v.group.position.x - x, v.group.position.z - z) < r + 0.3) return false;
  }
  return true;
}
function canAfford(cost) { return state.money >= (cost.money || 0) && state.wood >= (cost.wood || 0); }
function costString(cost) {
  return [cost.money ? `💰 ${cost.money}` : '', cost.wood ? `🪵 ${cost.wood}` : ''].filter(Boolean).join('  ');
}
function isNameTaken(name, exclude = null) {
  for (const b of state.buildings) if (b !== exclude && b.name === name) return true;
  for (const v of state.villagers) if (v !== exclude && v.name === name) return true;
  return false;
}
function nextAutoName(base, names) {
  const esc = base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('^' + esc + ' (\\d+)$');
  const used = new Set();
  for (const n of names) { const m = n.match(re); if (m) used.add(parseInt(m[1], 10)); }
  let k = 1; while (used.has(k)) k++;
  return base + ' ' + k;
}
function nextBuildingName(t) { return nextAutoName(BUILDINGS[t].name, state.buildings.map(b => b.name)); }
function nextVillagerName(t) { return nextAutoName(VILLAGERS[t].name, state.villagers.map(v => v.name)); }

function addBuilding(type, x, z, level = 1, rotation = 0, name = null, skipChickens = false) {
  const def = BUILDINGS[type];
  const group = createBuildingMesh(type, level);
  group.position.set(x, 0, z);
  group.rotation.y = rotation;
  scene.add(group);
  state.buildingCounter++;
  const b = {
    id: state.buildingCounter, type, def, group, x, z,
    workers: 0, level, rotation,
    name: name || nextBuildingName(type),
    frightenedUntil: 0,
    _openAmount: 0
  };
  group.userData.buildingRef = b;
  state.buildings.push(b);
  if (type === 'coop' && !skipChickens) for (let i = 0; i < 3; i++) addChickenToCoop(b);
  return b;
}
function findBuilding(obj) {
  while (obj) { if (obj.userData && obj.userData.buildingRef) return obj.userData.buildingRef; obj = obj.parent; }
  return null;
}

function isOnPierDeck(px, pz, pier) {
  const dx = px - pier.x, dz = pz - pier.z;
  const rot = pier.rotation || 0;
  const cosR = Math.cos(rot), sinR = Math.sin(rot);
  const lx = dx * cosR - dz * sinR;
  const lz = dx * sinR + dz * cosR;
  return (Math.abs(lx) < 1.0 && lz > -0.3 && lz < 3.15);
}
function getPierDeckY(px, pz) {
  for (const b of state.buildings) {
    if (b.type !== 'pier') continue;
    if (isOnPierDeck(px, pz, b)) return 0.32;
  }
  return 0;
}

function addChickenToCoop(coop) {

  const ch = { group: g, coop, target: null, waitTimer: Math.random() * 2,
    bob: Math.random() * 10, speed: 0.55 + Math.random() * 0.35 };
  g.userData.chickenRef = ch;
  state.chickens.push(ch);
  return true;
}
function buyChicken() {
  const coops = state.buildings.filter(b => b.type === 'coop');
  if (coops.length === 0) { toast('Нет курятника', 'err'); return false; }
  const avail = coops.filter(c => state.chickens.filter(ch => ch.coop === c).length < 10);
  if (avail.length === 0) { toast('Все курятники полны', 'err'); return false; }
  addChickenToCoop(avail[Math.floor(Math.random() * avail.length)]);
  return true;
}
function findChicken(obj) {
  while (obj) { if (obj.userData && obj.userData.chickenRef) return obj.userData.chickenRef; obj = obj.parent; }
  return null;
}
function updateChickens(dt) {
  for (const ch of state.chickens) {
    if (ch.waitTimer > 0) { ch.waitTimer -= dt; continue; }
    if (!ch.target) {
      const a = Math.random() * Math.PI * 2, r = 1.4 + Math.random() * 1.2;
      ch.target = { x: ch.coop.x + Math.cos(a) * r, z: ch.coop.z + Math.sin(a) * r };
    }
    const dx = ch.target.x - ch.group.position.x, dz = ch.target.z - ch.group.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.2) { ch.target = null; ch.waitTimer = 0.8 + Math.random() * 2.5; continue; }
    const step = Math.min(ch.speed * dt, dist);
    ch.group.position.x += (dx / dist) * step;
    ch.group.position.z += (dz / dist) * step;
    ch.group.rotation.y = Math.atan2(dx, dz);
    ch.bob += dt * 12;
    ch.group.position.y = Math.abs(Math.sin(ch.bob)) * 0.03;
  }
}
function killChickenNear(coop) {
  const cand = state.chickens.filter(c => c.coop === coop);
  if (cand.length === 0) return false;
  const ch = cand[0];
  scene.remove(ch.group);
  ch.group.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  const i = state.chickens.indexOf(ch);
  if (i >= 0) state.chickens.splice(i, 1);
  return true;
}

      capFood: state.capFood, capWood: state.capWood,
      hasGun: state.hasGun, hasFishingRod: state.hasFishingRod, hasAxe: state.hasAxe,

      })),
      villagers: state.villagers.map(v => ({
        type: v.type,
        x: v.group.position.x, z: v.group.position.z,
        name: v.name,
        homeId: v.home ? v.home.id : null,
        workplaceId: v.workplace ? v.workplace.id : null,
        hunger: v.hunger,
        customTask: v.customTask || null
      })),
      chickens: state.chickens.map(c => ({
        coopId: c.coop.id,
        x: c.group.position.x, z: c.group.position.z
      }))

function clearScene() {
  for (const a of state.animals) {
    scene.remove(a.group);
    a.group.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  }
  state.animals = [];
  for (const ch of state.chickens) {
    scene.remove(ch.group);
    ch.group.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  }
  state.chickens = [];
  for (const v of state.villagers) {
    scene.remove(v.group);
    v.group.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  }
  state.villagers = [];
  for (const b of state.buildings) {
    scene.remove(b.group);
    b.group.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  }
  state.buildings = [];
}
function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    if (!data || data.v !== 1) return false;
    clearScene();
    state.money = data.money ?? 500;
    state.food = data.food ?? 100;
    state.wood = data.wood ?? 30;
    state.capFood = data.capFood ?? 200;
    state.capWood = data.capWood ?? 100;
    state.hasGun = !!data.hasGun;
    state.hasFishingRod = !!data.hasFishingRod;
    state.hasAxe = !!data.hasAxe;
    state.nextAnimalSpawn = data.nextAnimalSpawn ?? 20;
    state.nextBearSpawn = data.nextBearSpawn ?? (300 + Math.random() * 300);
    state.nextPreySpawn = data.nextPreySpawn ?? 10;
    state.buildingCounter = data.buildingCounter || 0;
    const idMap = {};
    for (const bData of (data.buildings || [])) {
      const b = addBuilding(bData.type, bData.x, bData.z, bData.level || 1, bData.rotation || 0, bData.name, true);
      b.id = bData.id;
      idMap[bData.id] = b;
      if (b.id > state.buildingCounter) state.buildingCounter = b.id;
    }
    for (const vData of (data.villagers || [])) {
      const v = spawnVillager(vData.type, vData.x, vData.z, vData.name);
      v.hunger = vData.hunger ?? 100;
      if (vData.homeId && idMap[vData.homeId]) v.home = idMap[vData.homeId];
      if (vData.workplaceId && idMap[vData.workplaceId]) v.workplace = idMap[vData.workplaceId];
      v.customTask = vData.customTask || null;
    }
    for (const cData of (data.chickens || [])) {
      const coop = idMap[cData.coopId];
      if (!coop) continue;
      const g = makeChickenMesh();
      g.position.set(cData.x, 0, cData.z);
      scene.add(g);
      const ch = {
        group: g, coop, target: null,
        waitTimer: Math.random() * 2,
        bob: Math.random() * 10,
        speed: 0.55 + Math.random() * 0.35
      };
      g.userData.chickenRef = ch;
      state.chickens.push(ch);
    }
    return true;
  } catch (e) {
    console.warn('Load failed', e);
    return false;
  }
}

function showConfirm({ title, body, confirmText = 'Подтвердить', danger = false, onConfirm }) {

    <div class="modal">
      <h3>${title}</h3>
      <div class="modal-body">${body}</div>

        <button class="mbtn ${danger ? 'danger' : 'confirm'} confirm-action" type="button">${confirmText}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => { if (overlay.parentNode) overlay.remove(); };
  overlay.querySelector('.cancel').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); close(); });
  overlay.querySelector('.confirm-action').addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation(); close();
    if (typeof onConfirm === 'function') { try { onConfirm(); } catch (err) { console.error(err); } }
  });
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.addEventListener('pointerdown', e => e.stopPropagation());
}
function showNamePrompt(defaultName, title, onConfirm, exclude = null) {

    <div class="modal">

  const input = overlay.querySelector('.name-input');
  const errEl = overlay.querySelector('.name-error');
  input.focus(); input.select();
  const close = () => { if (overlay.parentNode) overlay.remove(); };
  const confirm = () => {

    if (items.length === 0) continue;

    const def = VILLAGERS[type];
    html += `<button class="pm-item" data-action="villager" data-type="${type}">

      <span class="pm-cost">${costString(def.cost)}</span>

/* =========================================================
   13. ЖИТЕЛИ
   ========================================================= */
function houseCapacity(h) {
  if (h.def.capacities) return h.def.capacities[Math.min((h.level||1)-1, h.def.capacities.length-1)];
  return (h.def.capacity || 0) * (h.level || 1);
}
function workplaceSlots(w) { return (w.def.jobs || 0) * (w.level || 1); }
function getHouseOccupants(h) { return state.villagers.filter(v => v.home === h).length; }
function getWorkersAt(w) { return state.villagers.filter(v => v.workplace === w).length; }
function findFreeVillagerSpot() {
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2, d = 3 + Math.random() * 10;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (isInRiver(x, z)) continue;
    let ok = true;
    for (const b of state.buildings) {
      if ((b.x - x) ** 2 + (b.z - z) ** 2 < (b.def.radius + 0.4) ** 2) { ok = false; break; }
    }
    if (ok) return { x, z };
  }
  return null;
}
function getVillagerSpeed(v) {
  const base = v.type === 'man' ? 1.55 : 1.35;
  const h = Math.max(0, Math.min(100, v.hunger));
  return base * (0.5 + h / 100);
}
function spawnVillager(type, x, z, name = null) {
  const def = VILLAGERS[type];
  const group = createVillagerMesh(type);
  group.position.set(x, 0, z);
  scene.add(group);
  const v = {
    type, def, group, x, z, name: name || nextVillagerName(type),
    home: null, workplace: null, behaviorState: 'idle',
    target: null, waitTimer: Math.random() * 1.5, moveTimer: 0,
    bob: Math.random() * 10,
    speed: type === 'man' ? 1.55 : 1.35,
    homeAngle: Math.random() * Math.PI * 2,
    workAngle: Math.random() * Math.PI * 2,
    hunger: 100,
    customTask: null, taskSpot: null,
    _toolMesh: null,
    chopPhase: 0,
    huntTimer: 0,
    huntingTarget: null,
    _aimTarget: null,
    _aimTimer: 0
  };
  group.userData.villagerRef = v;
  state.villagers.push(v);
  return v;
}
function findVillager(obj) {
  while (obj) { if (obj.userData && obj.userData.villagerRef) return obj.userData.villagerRef; obj = obj.parent; }
  return null;
}
function autoAssign(v) {
  const houses = state.buildings.filter(b => (b.def.capacities || b.def.capacity) && getHouseOccupants(b) < houseCapacity(b));
  if (houses.length) v.home = houses[0];
  const jobs = state.buildings.filter(b =>
    b.def.jobs > 0 && getWorkersAt(b) < workplaceSlots(b) && canWorkAt(v, b)
  );
  if (jobs.length) v.workplace = jobs[0];
}
function getSpotOutside(building, angle) {
  const r = building.def.radius * 0.75 + 0.7;
  const x = building.x + Math.cos(angle) * r;
  const z = building.z + Math.sin(angle) * r;
  if (isInRiver(x, z)) return { x, z: RIVER_Z - RIVER_HALF_WIDTH - 0.6 };
  return { x, z };
}
function getChopSpot(v) {
  if (!v.taskSpot) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.random() * CHOP_RADIUS * 0.7;
    v.taskSpot = {
      x: CHOP_CX + Math.cos(a) * d,
      z: CHOP_CZ + Math.sin(a) * d
    };
  }
  return { x: v.taskSpot.x, z: v.taskSpot.z };
}
function getFishingSpot(v) {
  const piers = state.buildings.filter(b => b.type === 'pier');
  if (piers.length) {
    const p = piers[0];
    const rot = p.rotation || 0;
    const dist = 1.5;
    v.taskSpot = {

      a.bob += dt * 10; g.position.y = Math.abs(Math.sin(a.bob)) * 0.05;
      continue;
    }
    if (a.state === 'atTarget') {
      a.leaveTimer -= dt;
      if (a.leaveTimer <= 0) {
        if (a.peaceful && a.peacefulStopsLeft > 0) {
          a.peacefulStopsLeft--;
          a.target = { x: (Math.random() - 0.5) * BOUND, z: (Math.random() - 0.5) * BOUND };
          a.state = 'approaching';
          a.leaveTimer = 0;
          continue;
        }
        const side = Math.floor(Math.random() * 4);
        const e = BOUND + 5;
        let lx, lz;
        if (side === 0) { lx = (Math.random() * 2 - 1) * e; lz = -e; }
        else if (side === 1) { lx = (Math.random() * 2 - 1) * e; lz = e; }
        else if (side === 2) { lx = -e; lz = (Math.random() * 2 - 1) * e; }
        else { lx = e; lz = (Math.random() * 2 - 1) * e; }
        a.state = 'leaving'; a.leavePos = { x: lx, z: lz };
      }
      continue;
    }
    const dx = a.target.x - g.position.x, dz = a.target.z - g.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 2.5) {
      a.state = 'atTarget';
      a.leaveTimer = 3 + Math.random() * 4;
      if (!a.peaceful) onAnimalReachTarget(a);
      continue;
    }
    const stepLen = Math.min(a.def.speed * dt, dist);
    const nx = g.position.x + (dx / dist) * stepLen;
    const nz = g.position.z + (dz / dist) * stepLen;
    if (a.type === 'bear' || a.type === 'fox' || a.type === 'wolf') {
      let blockingFence = null;
      for (const b of state.buildings) {
        if (!b.def.isFence) continue;
        if (Math.hypot(nx - b.x, nz - b.z) < b.def.radius + 0.9) { blockingFence = b; break; }
      }
      if (blockingFence) {
        if (a.attackFence !== blockingFence) {
          a.attackFence = blockingFence; a.attackTimer = 0;
          const verb = a.type === 'bear' ? 'грызёт' : 'ломает';
          toast(`${a.def.icon} ${a.def.name} ${verb} ${blockingFence.name}!`, 'warn');
        }
        a.attackTimer += dt;
        const breakTime = a.type === 'bear' ? 30 : 60;
        if (a.attackTimer >= breakTime) {
          toast(`${a.def.icon} ${a.def.name} разрушил(а) ${blockingFence.name}!`, 'err');
          scene.remove(blockingFence.group);
          blockingFence.group.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
          const bi = state.buildings.indexOf(blockingFence);
          if (bi >= 0) state.buildings.splice(bi, 1);
          a.attackFence = null; a.attackTimer = 0;
        }
        a.bob += dt * 4; g.position.y = Math.abs(Math.sin(a.bob)) * 0.04;
        continue;
      } else { a.attackFence = null; a.attackTimer = 0; }
    }
    g.position.x = nx;
    g.position.z = nz;
    g.rotation.y = Math.atan2(dx, dz);
    a.bob += dt * 10;
    g.position.y = Math.abs(Math.sin(a.bob)) * 0.05;
    if (a.type === 'bear' && !a.peaceful) {
      a.killCooldown -= dt;
      if (a.killCooldown <= 0) {
        for (const v of state.villagers) {
          if (v._dead) continue;
          if (Math.hypot(v.group.position.x - g.position.x, v.group.position.z - g.position.z) < 1.8) {
            v._dead = true; toast(`🐻 ${v.name} убит(а) медведем!`, 'err');
            a.killCooldown = 2; break;
          }
        }
      }
    }
  }
}
function updatePrey(dt) {
  for (let i = state.animals.length - 1; i >= 0; i--) {
    const a = state.animals[i];
    if (!a.isPrey) continue;
    const g = a.group;
    let hunter = null;
    for (const v of state.villagers) {
      if (v.behaviorState !== 'hunting_prey') continue;
      const d = Math.hypot(v.group.position.x - g.position.x, v.group.position.z - g.position.z);
      if (d < 7) { hunter = v; break; }
    }
    if (hunter) {
      const fdx = g.position.x - hunter.group.position.x;
      const fdz = g.position.z - hunter.group.position.z;
      const fd = Math.hypot(fdx, fdz) || 1;
      a.target = {
        x: g.position.x + (fdx / fd) * 8,
        z: g.position.z + (fdz / fd) * 8
      };
      a.waitTimer = 0;
    }
    if (a.waitTimer > 0) { a.waitTimer -= dt; g.position.y = 0; continue; }
    if (!a.target) {
      const ang = Math.random() * Math.PI * 2;
      const d = Math.random() * FOREST_RADIUS;
      a.target = {
        x: FOREST_CX + Math.cos(ang) * d,
        z: FOREST_CZ + Math.sin(ang) * d
      };
    }
    const dx = a.target.x - g.position.x;
    const dz = a.target.z - g.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.3) {
      a.target = null;
      a.waitTimer = 1 + Math.random() * 2.5;
      continue;
    }
    const step = Math.min(a.def.speed * dt, dist);
    g.position.x += (dx / dist) * step;
    g.position.z += (dz / dist) * step;
    g.rotation.y = Math.atan2(dx, dz);
    a.bob += dt * 8;
    g.position.y = Math.abs(Math.sin(a.bob)) * 0.06;
    if (isInRiver(g.position.x, g.position.z)) {
      g.position.z = RIVER_Z - RIVER_HALF_WIDTH - 0.5;
    }
    const dxF = g.position.x - FOREST_CX;
    const dzF = g.position.z - FOREST_CZ;
    const dF = Math.hypot(dxF, dzF);
    if (dF > FOREST_RADIUS * 1.3) {
      g.position.x = FOREST_CX + (dxF / dF) * FOREST_RADIUS * 1.3;
      g.position.z = FOREST_CZ + (dzF / dF) * FOREST_RADIUS * 1.3;
    }
  }
}
function onAnimalReachTarget(a) {
  if (a.type === 'bear') {
    const steal = Math.min(state.food, 40);
    if (steal > 0) { state.food -= steal; toast(`🐻 Медведь съел ${Math.round(steal)} еды!`, 'err'); }
    else toast('🐻 Медведь порылся в кладовой', '');
  } else if (a.type === 'fox' || a.type === 'wolf') {
    if (a.targetBuilding && a.targetBuilding.type === 'coop') {
      const killed = killChickenNear(a.targetBuilding);
      a.targetBuilding.frightenedUntil = performance.now() / 1000 + 25;
      if (killed) toast(`${a.def.icon} ${a.def.name} съел(а) курицу из ${a.targetBuilding.name}!`, 'err');
      else toast(`${a.def.icon} ${a.def.name} напугал(а) кур в ${a.targetBuilding.name}!`, 'warn');
    }
  }
}
/* Открытие ворот при приближении жителя */
function updateGates(dt) {
  for (const b of state.buildings) {
    if (!b.def.isGate) continue;
    const g = b.group;
    const left = g.userData.leftPanel;
    const right = g.userData.rightPanel;
    if (!left || !right) continue;

    let shouldOpen = false;
    for (const v of state.villagers) {
      const d = Math.hypot(v.group.position.x - b.x, v.group.position.z - b.z);
      if (d < 3.5) { shouldOpen = true; break; }
    }

    const target = shouldOpen ? 1 : 0;
    const speed = 3.5 * dt;
    if (b._openAmount < target) {
      b._openAmount = Math.min(1, b._openAmount + speed);
    } else if (b._openAmount > target) {
      b._openAmount = Math.max(0, b._openAmount - speed);
    }
    // Плавное открытие: створки поворачиваются на ±80°
    const angle = b._openAmount * (Math.PI / 180) * 80;
    left.rotation.y = -angle;
    right.rotation.y = angle;
  }
}

  } else if (target.kind === 'villager') {
    const v = target.ref;
    if (!state.villagers.includes(v)) return;

        toast(`✏️ "${old}" → "${newName}"`, 'ok');
      }, v);

    else if (act === 'assign-work') showWorkPicker(v);

      if (v.workplace) {
        const n = v.workplace.name;
        v.workplace = null; v.target = null; v.behaviorState = 'idle';
        toast(`${v.name} уволен(а) с ${n}`, '');
      }
    } else if (act === 'send-home') sendVillagerHome(v);
    else if (act === 'send-work') sendVillagerWork(v);
    else if (act === 'feed') {
      if (state.food >= 15) { state.food -= 15; v.hunger = 100; toast(`${v.name} поел(а)`, 'ok'); }
    } else if (act === 'send-forest') {
      if (!state.hasAxe) { toast('Нужен топор (в магазине)', 'err'); return; }
      v.customTask = 'forest'; v.taskSpot = null;
      v.target = null; v.waitTimer = 0; v.moveTimer = 0;
      v.behaviorState = 'idle';
      v.huntTimer = 0;
      toast(`🪓 ${v.name} отправлен в лес (2 мин)`, '');

      if (!state.hasFishingRod) { toast('Нужна удочка с ведром', 'err'); return; }
      if (v.type !== 'man') { toast('На рыбалку ходят только мужчины', 'err'); return; }
      v.customTask = 'fish'; v.taskSpot = null;
      v.target = null; v.waitTimer = 0; v.moveTimer = 0;
      v.behaviorState = 'idle';

      if (v.type !== 'man') { toast('На охоту ходят только мужчины', 'err'); return; }
      v.customTask = 'hunt'; v.taskSpot = null;

      v.huntTimer = 0;

    </button>`;
  });
  html += `</div><div class="modal-actions"><button class="mbtn cancel" type="button">Отмена</button></div>`;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelectorAll('.picker-item').forEach(btn => {
    btn.onclick = () => {
      if (btn.disabled) return;
      const wp = state.buildings.find(b => b.id === parseInt(btn.dataset.id, 10));
      if (wp) {
        v.workplace = wp; v.target = null; v.waitTimer = 0; v.moveTimer = 0;
        v.behaviorState = 'idle';
        toast(`${v.name} работает на ${wp.name}`, 'ok');
      }
      overlay.remove();
    };
  });
}
function confirmUpgrade(b) {
  const def = b.def, lvl = b.level || 1;
  if (lvl >= 3) { toast('Максимальный уровень', 'err'); return; }
  const cost = {
    money: Math.round((def.cost.money || 0) * 0.9 * lvl),
    wood: Math.round((def.cost.wood || 0) * 0.7 * lvl)
  };
  let capText = '';
  if (def.capacities) {
    capText = `<span class="desc">Жителей: ${def.capacities[lvl-1]} → ${def.capacities[lvl]}</span>`;
  }
  showConfirm({
    title: `Улучшить ${b.name}?`,
    body: `Уровень ${lvl} → ${lvl + 1}<br>
      <span class="cost">Стоимость: ${costString(cost)}</span>
      <span class="desc">Внешний вид и характеристики улучшатся</span>
      ${capText}`,
    confirmText: 'Улучшить',
    onConfirm: () => {
      if (!canAfford(cost)) { toast('Недостаточно ресурсов', 'err'); return; }
      state.money -= cost.money;
      state.wood -= cost.wood;
      b.level = lvl + 1;
      const oldGroup = b.group;
      const newGroup = createBuildingMesh(b.type, b.level);
      newGroup.position.copy(oldGroup.position);
      newGroup.rotation.copy(oldGroup.rotation);
      if (newGroup.userData.leftPanel) {
        b._openAmount = 0;
        newGroup.userData.leftPanel.rotation.y = 0;
        newGroup.userData.rightPanel.rotation.y = 0;
      }
      scene.remove(oldGroup);
      oldGroup.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
      scene.add(newGroup);
      newGroup.userData.buildingRef = b;
      b.group = newGroup;
      toast(`⬆️ ${b.name} → уровень ${b.level}`, 'ok');
    }
  });
}
function confirmDelete(b) {
  const refundMoney = Math.floor((b.def.cost.money || 0) * 0.5);
  const refundWood = Math.floor((b.def.cost.wood || 0) * 0.5);
  showConfirm({
    title: `Удалить ${b.name}?`,
    body: `Объект будет снесён.<br>
      <span class="cost">Возврат: ${costString({ money: refundMoney, wood: refundWood })}</span>`,
    confirmText: 'Удалить', danger: true,
    onConfirm: () => {
      state.villagers.forEach(v => {
        if (v.home === b) { v.home = null; v.target = null; v.behaviorState = 'idle'; }
        if (v.workplace === b) { v.workplace = null; v.target = null; v.behaviorState = 'idle'; }
      });
      if (b.type === 'coop') {
        for (let i = state.chickens.length - 1; i >= 0; i--) {
          if (state.chickens[i].coop === b) {
            const ch = state.chickens[i];
            scene.remove(ch.group);
            ch.group.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
            state.chickens.splice(i, 1);
          }
        }
      }
      state.money += refundMoney;
      state.wood += refundWood;
      scene.remove(b.group);
      b.group.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
      const i = state.buildings.indexOf(b);
      if (i >= 0) state.buildings.splice(i, 1);
      toast(`Снесено: +${refundMoney}💰 +${refundWood}🪵`, 'ok');
    }
  });
}

/* =========================================================
   16. МЫШЬ / ТАЧ
   ========================================================= */
let downInfo = null;
function updatePtr(e) {
  ptr.x = (e.clientX / window.innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ptrValid = true;
}
renderer.domElement.addEventListener('pointerdown', e => {
  updatePtr(e);
  downInfo = { x: e.clientX, y: e.clientY, button: e.button };
});
window.addEventListener('pointermove', updatePtr);
window.addEventListener('pointerup', e => {
  if (!downInfo) return;
  const moved = Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y);
  const wasLeft = downInfo.button === 0 && e.button === 0;
  const wasRight = downInfo.button === 2 && e.button === 2;
  downInfo = null;
  if (moved > 6) return;
  if (wasLeft) handleLeftClick(e);
  else if (wasRight) handleRightClick(e);
});
function handleLeftClick(e) {
  closePlusMenu();
  if (demolishMode) {
    raycaster.setFromCamera(ptr, camera);
    const hits = raycaster.intersectObjects(state.buildings.map(b => b.group), true);
    if (hits.length) {
      const b = findBuilding(hits[0].object);
      if (b) confirmDelete(b);
    }
    return;
  }
  if (ghostMode === 'build') {
    raycaster.setFromCamera(ptr, camera);
    const hits = raycaster.intersectObject(ground);
    if (!hits.length) return;
    const p = hits[0].point;
    const x = Math.round(p.x * 2) / 2;
    const z = Math.round(p.z * 2) / 2;
    const def = BUILDINGS[ghostType];
    if (!canAfford(def.cost)) { toast('Недостаточно ресурсов', 'err'); cancelPlacement(); return; }
    if (!isValidPlacement(ghostType, x, z)) {
      if (def.onWater) toast('Пирс ставится на реке или у берега', 'err');
      else if (def.needsRiver) toast('Только у южного берега реки', 'err');
      else if (isInRiver(x, z)) toast('Нельзя строить в воде', 'err');
      else toast('Здесь нельзя строить', 'err');
      return;
    }
    state.money -= def.cost.money || 0;
    state.wood -= def.cost.wood || 0;
    const b = addBuilding(ghostType, x, z, 1, ghostRotation);
    toast(`${def.icon} ${b.name} построен`, 'ok');
    if (!(def.isFence && canAfford(def.cost))) cancelPlacement();
    saveGame();
    return;
  }
  if (ghostMode === 'move' && ghostBuilding) {
    raycaster.setFromCamera(ptr, camera);
    const hits = raycaster.intersectObject(ground);
    if (!hits.length) return;
    const p = hits[0].point;
    const x = Math.round(p.x * 2) / 2;
    const z = Math.round(p.z * 2) / 2;
    if (!isValidPlacement(ghostBuilding.type, x, z, ghostBuilding)) {
      toast('Здесь нельзя разместить', 'err'); return;
    }
    ghostBuilding.x = x; ghostBuilding.z = z;
    ghostBuilding.rotation = ghostRotation;
    ghostBuilding.group.position.set(x, 0, z);
    ghostBuilding.group.rotation.y = ghostRotation;
    ghostBuilding.group.visible = true;
    toast('↔️ Перемещено', 'ok');
    cancelPlacement();
    saveGame();
    return;
  }
}
function handleRightClick(e) {
  e.preventDefault();
  closePlusMenu();
  if (ghostMode || demolishMode) { cancelPlacement(); return; }
  raycaster.setFromCamera(ptr, camera);
  const vHits = raycaster.intersectObjects(state.villagers.map(v => v.group), true);
  if (vHits.length) {
    const v = findVillager(vHits[0].object);
    if (v) { openVillagerContextMenu(e.clientX, e.clientY, v); return; }
  }
  const cHits = raycaster.intersectObjects(state.chickens.map(c => c.group), true);
  if (cHits.length) {
    const ch = findChicken(cHits[0].object);
    if (ch) { openBuildingContextMenu(e.clientX, e.clientY, ch.coop); return; }
  }
  const hits = raycaster.intersectObjects(state.buildings.map(b => b.group), true);
  if (hits.length) {
    const b = findBuilding(hits[0].object);
    if (b) { openBuildingContextMenu(e.clientX, e.clientY, b); return; }
  }
  closeContextMenu();
}
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('pointerdown', e => {
  if (el.ctxMenu.classList.contains('open') && !el.ctxMenu.contains(e.target)) closeContextMenu();
  if (el.plusMenu.classList.contains('open') &&
      !el.plusMenu.contains(e.target) &&
      !document.getElementById('plus-btn').contains(e.target)) closePlusMenu();
}, true);

/* =========================================================
   17. ЭКОНОМИКА
   ========================================================= */
function economyTick(dt) {
  const counts = {};
  for (const b of state.buildings) counts[b.type] = (counts[b.type] || 0) + 1;
  state.capFood = 200 + 150 * (counts.warehouse || 0);
  state.capWood = 100 + 120 * (counts.warehouse || 0);
  const housing = state.buildings.reduce((s, b) => s + houseCapacity(b), 0);
  state.housing = housing;
  let jobsTotal = 0;
  for (const b of state.buildings) jobsTotal += (b.def.jobs || 0) * (b.level || 1);
  let jobsFilled = 0;
  for (const v of state.villagers) if (v.workplace) jobsFilled++;
  state.jobsTotal = jobsTotal;
  state.jobsFilled = Math.min(jobsFilled, jobsTotal);
  const now = performance.now() / 1000;
  let foodProd = 0, woodProd = 0;
  for (const b of state.buildings) {
    const workersHere = state.villagers.filter(v => v.workplace === b).length;
    const slots = (b.def.jobs || 0) * (b.level || 1);
    if (slots === 0) continue;
    let eff = Math.min(1, workersHere / slots);
    if (b.frightenedUntil > now) eff *= 0.3;
    const lvl = b.level || 1;
    if (b.def.food) foodProd += b.def.food * eff * lvl;
    if (b.def.wood) woodProd += b.def.wood * eff * lvl;
  }
  foodProd += state.chickens.length * 0.06;
  const manualFishers = state.villagers.filter(v => v.behaviorState === 'fishing').length;
  if (state.hasFishingRod) foodProd += manualFishers * 0.4;
  if (state.hasFishingRod) {
    const pierCount = state.buildings.filter(b => b.type === 'pier').length;
    foodProd += pierCount * 0.7;
  }
  const choppers = state.villagers.filter(v => v.behaviorState === 'chopping').length;
  woodProd += choppers * 0.5;
  const foodUse = state.villagers.length * 0.09;
  state.food += (foodProd - foodUse) * dt;
  if (state.food < 0) state.food = 0;
  if (state.food > state.capFood) state.food = state.capFood;
  state.wood += woodProd * dt;
  if (state.wood > state.capWood) state.wood = state.capWood;
  state.foodRate = foodProd - foodUse;
  state.woodRate = woodProd;
  let income = 0;
  if (state.food > 0 && state.villagers.length > 0) {
    const tax = state.villagers.length * 1.2;
    state.money += tax * dt; income += tax;
  }
  const marketCount = state.buildings.filter(b => b.type === 'market').length;
  if (marketCount > 0) {
    const bonus = marketCount * 2.5;
    state.money += bonus * dt; income += bonus;
  }
  const marketWorkers = state.villagers.filter(v => v.workplace && v.workplace.type === 'market').length;
  if (marketWorkers > 0) {
    const foodSurplus = Math.max(0, state.food - 80);
    const woodSurplus = Math.max(0, state.wood - 50);
    const sellF = Math.min(foodSurplus, marketWorkers * 3.0 * dt);
    const sellW = Math.min(woodSurplus, marketWorkers * 0.8 * dt);
    state.food -= sellF; state.wood -= sellW;
    const gained = sellF * 4 + sellW * 10;
    state.money += gained; income += gained / Math.max(dt, 1e-6);
  }
  state.income += (income - state.income) * Math.min(1, dt * 3);
  state.nextAnimalSpawn -= dt;
  if (state.nextAnimalSpawn <= 0) {
    const spawned = spawnAnimal();
    state.nextAnimalSpawn = spawned ? (40 + Math.random() * 160) : 30;
  }
  state.nextBearSpawn -= dt;
  if (state.nextBearSpawn <= 0) {
    spawnAnimal('bear');
    state.nextBearSpawn = 300 + Math.random() * 300;
  }
  state.nextPreySpawn -= dt;
  if (state.nextPreySpawn <= 0) {
    const preyCount = state.animals.filter(a => a.isPrey).length;
    if (preyCount < 8) {
      spawnPrey();
      if (Math.random() < 0.5) spawnPrey();
    }
    state.nextPreySpawn = 30 + Math.random() * 40;
  }
}

/* =========================================================
   18. UI ОБНОВЛЕНИЕ
   ========================================================= */
let uiAcc = 0;
function updateUI(dt) {
  uiAcc += dt;
  if (uiAcc < 0.08) return;
  uiAcc = 0;
  const moneyStr = Math.floor(state.money).toLocaleString('ru-RU');
  el.money.textContent = moneyStr;
  el.food.textContent = `${Math.floor(state.food)}/${state.capFood}`;
  el.wood.textContent = `${Math.floor(state.wood)}/${state.capWood}`;
  el.pop.textContent = `${state.villagers.length}/${state.housing}`;
  el.chickens.textContent = state.chickens.length;
  el.jobs.textContent = `${state.jobsFilled}/${state.jobsTotal}`;
  el.sFood.textContent = signed(state.foodRate) + '/с';
  el.sFood.className = state.foodRate >= 0 ? 'pos' : 'neg';
  el.sWood.textContent = signed(state.woodRate) + '/с';
  el.sWood.className = state.woodRate >= 0 ? 'pos' : 'neg';
  el.sIncome.textContent = signed(state.income) + '/с';
  el.sIncome.className = state.income >= 0 ? 'pos' : 'neg';
  const bCount = state.buildings.filter(b => !b.def.isFence).length;
  const eCount = state.buildings.filter(b => b.def.isFence).length;
  el.cMoney.textContent = moneyStr;
  el.cFood.textContent = Math.floor(state.food);
  el.cWood.textContent = Math.floor(state.wood);
  el.cVillagers.textContent = state.villagers.length;
  el.cBuildings.textContent = bCount;
  el.cEnv.textContent = eCount;
  document.getElementById('cnt-villagers').textContent = state.villagers.length;
  document.getElementById('cnt-buildings').textContent = bCount;
  document.getElementById('cnt-environment').textContent = eCount;
}

/* =========================================================
   19. КЛАВИАТУРА
   ========================================================= */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape') { cancelPlacement(); closePlusMenu(); closeContextMenu(); }
  if (e.code === 'KeyQ' && ghost) { ghostRotation += Math.PI / 4; ghost.rotation.y = ghostRotation; }
  if (e.code === 'KeyE' && ghost) { ghostRotation -= Math.PI / 4; ghost.rotation.y = ghostRotation; }
  if (['ShiftLeft','ShiftRight','ControlLeft','ControlRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _move = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
function keyboardPan(dt) {
  camera.getWorldDirection(_fwd);
  _fwd.y = 0;
  if (_fwd.lengthSq() < 1e-6) return;
  _fwd.normalize();
  _right.crossVectors(_fwd, UP).normalize();
  _move.set(0, 0, 0);
  if (keys.KeyW || keys.ArrowUp) _move.add(_fwd);
  if (keys.KeyS || keys.ArrowDown) _move.sub(_fwd);
  if (keys.KeyD || keys.ArrowRight) _move.add(_right);
  if (keys.KeyA || keys.ArrowLeft) _move.sub(_right);
  const speed = 22 * dt;
  if (_move.lengthSq() > 0) {
    _move.normalize().multiplyScalar(speed);
    camera.position.add(_move); controls.target.add(_move);
  }
  let dy = 0;
  if (keys.ShiftLeft || keys.ShiftRight) dy += 15 * dt;
  if (keys.ControlLeft || keys.ControlRight) dy -= 15 * dt;
  if (dy !== 0) {
    camera.position.y = Math.max(2, Math.min(80, camera.position.y + dy));
    controls.target.y = Math.max(0, Math.min(60, controls.target.y + dy));
  }
}

/* =========================================================
   20. GHOST
   ========================================================= */
function updateGhost() {
  if (!ghost || !ptrValid) return;
  raycaster.setFromCamera(ptr, camera);
  const hits = raycaster.intersectObject(ground);
  if (!hits.length) { ghost.visible = false; return; }
  const p = hits[0].point;
  const x = Math.round(p.x * 2) / 2;
  const z = Math.round(p.z * 2) / 2;
  ghost.position.set(x, 0, z);
  ghost.visible = true;
  let ok = true;
  if (ghostMode === 'build') ok = isValidPlacement(ghostType, x, z) && canAfford(BUILDINGS[ghostType].cost);
  else if (ghostMode === 'move') ok = isValidPlacement(ghostBuilding.type, x, z, ghostBuilding);
  ghostMat.color.setHex(ok ? 0x55ff99 : 0xff5555);
}

/* =========================================================
   21. АНИМАЦИЯ РЕКИ
   ========================================================= */
let riverTime = 0;
function animateRiver(dt) {
  riverTime += dt;
  if (riverMesh && riverMesh.material) {
    riverMesh.material.opacity = 0.9 + Math.sin(riverTime * 1.5) * 0.05;
  }
}

/* =========================================================
   22. ЗАПУСК
   ========================================================= */
buildPlusMenu();
const loaded = loadGame();
if (!loaded) {
  addBuilding('house', 0, -10, 1, 0);
  setTimeout(() => {
    const v1 = spawnVillager('man', 4, -6); autoAssign(v1);
    const v2 = spawnVillager('woman', -4, -6); autoAssign(v2);
    for (let i = 0; i < 4; i++) spawnPrey();
    saveGame();
  }, 200);
  setTimeout(() => toast('👋 Добро пожаловать в деревню!', 'ok'), 400);
} else {
  toast('💾 Прогресс загружен', 'ok');
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  keyboardPan(dt);
  controls.update();
  economyTick(dt);
  updateVillagers(dt);
  updateChickens(dt);
  updatePredators(dt);
  updatePrey(dt);
  handleShooting(dt);
  updateGates(dt);
  animateRiver(dt);
  updateGhost();
  updateUI(dt);
  updateTimers();
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
